<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SML Finance Traders Loan - Daily Insight</title>
<link rel="stylesheet" href="s1.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a73e8;
            --bg: #f0f2f5;
            --text-main: #202124;
            --text-light: #5f6368;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: var(--text-main);
            margin: 0; 
            padding: 40px; 
        }

        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: white; 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: var(--shadow); 
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 40px; 
        }

        .back-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-back {
            background: #f1f3f4;
            border: none;
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-light);
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #e8eaed;
            color: var(--primary);
        }

        .date-container {
            background: #fff;
            padding: 10px 20px;
            border-radius: 15px;
            border: 1.5px solid #eee;
            display: flex;
            flex-direction: column;
        }

        .date-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .date-picker { 
            border: none; 
            font-weight: 600; 
            font-size: 16px; 
            outline: none; 
            cursor: pointer;
            font-family: inherit;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
        }

        th { 
            background-color: #f8f9fa; 
            color: var(--text-light); 
            text-align: left; 
            padding: 15px; 
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td { 
            padding: 15px; 
            border-bottom: 1px solid #eee; 
            font-size: 14px;
        }

        .count-badge {
            background: #e8f0fe;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 800;
            display: inline-block;
        }

        .count-badge.visit { background: #e6f4ea; color: #1e7e34; }
        .count-badge.call  { background: #fef7e0; color: #b06500; }
        .count-badge.total { background: #e8f0fe; color: var(--primary); }

        .dup-badge {
            background: #fce8e6;
            color: #c5221f;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .dup-badge:hover {
            background: #f9c8c4;
        }

        .dup-none {
            color: var(--text-light);
            font-size: 12px;
        }

        .no-data {
            display: none;
            text-align: center;
            padding: 60px;
            color: var(--text-light);
            font-weight: 600;
            font-size: 1.1rem;
        }

        #statusMsg {
            text-align: center;
            padding: 20px;
            font-weight: 600;
            color: var(--primary);
        }

        /* ── Duplicate drill-down modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 720px;
            max-height: 80vh;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 16px;
            color: var(--text-main);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            color: var(--text-light);
        }

        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .modal-body h4 {
            margin: 20px 0 8px;
            font-size: 13px;
            color: var(--primary);
        }

        .modal-body h4:first-child {
            margin-top: 0;
        }

        .modal-body table {
            margin-top: 0;
        }

        .modal-body th, .modal-body td {
            padding: 10px;
            font-size: 13px;
        }

        .no-prev {
            color: var(--text-light);
            font-style: italic;
            font-size: 13px;
            padding: 10px 0 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="back-nav">
             <button class="btn-back" onclick="window.location.href='report.html'">←</button>
             <h2 style="margin:0; font-weight:800; color:var(--primary); letter-spacing:-1px;">Daily Performance Insight</h2>
        </div>
        <div class="date-container">
            <span class="date-label">Insight Date</span>
            <input type="date" id="targetDate" class="date-picker" onchange="processDailyData()">
        </div>
    </div>

    <div id="statusMsg">Fetching global lead data...</div>

    <table id="insightTable" style="display:none;">
        <thead>
            <tr>
                <th>Branch</th>
                <th>Executive Name (Emp Code)</th>
                <th style="text-align:center;">Visits</th>
                <th style="text-align:center;">Calls</th>
                <th style="text-align:center;">Total</th>
                <th style="text-align:center;">Duplicate Phones</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    
    <div id="noDataMsg" class="no-data">No lead records found for the selected date.</div>
</div>

<div id="modalOverlay" class="modal-overlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="modalTitle">Duplicate History</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby8s9yDFaXGs0DK1W6chdm4iWx2nEm_KTGIE7fGbz974k84QRA7FxA3nmzViOHyiVwx/exec';
    let rawData = [];
    let currentSummary = {};

    window.onload = function() {
        document.getElementById('targetDate').valueAsDate = new Date();
        init();
    };

    async function init() {
        try {
            const response = await fetch(SCRIPT_URL + '?action=getData');
            rawData = await response.json();
            document.getElementById('statusMsg').style.display = 'none';
            // Log sample to console so you can verify date format from your sheet
            if (rawData.length > 0) {
                console.log('Sample record:', rawData[0]);
                console.log('Date field value:', rawData[0].visitdate || rawData[0].date);
            }
            processDailyData();
        } catch (e) {
            document.getElementById('statusMsg').innerHTML = `<span style="color:red;">Error connecting to MIS server.</span>`;
        }
    }

    function normalizeDate(raw) {
        // Handles all common formats from Google Sheets:
        // DD/MM/YYYY, MM/DD/YYYY (we treat / as DD/MM for India),
        // YYYY-MM-DD, DD-MM-YYYY, and JS Date strings
        if (!raw) return '';
        const s = raw.toString().trim();

        // Already YYYY-MM-DD
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;

        // Slash-separated: treat as DD/MM/YYYY (Indian format)
        const slashParts = s.split('/');
        if (slashParts.length === 3) {
            let [a, b, y] = slashParts;
            // If year is first part (YYYY/MM/DD)
            if (a.length === 4) return `${a}-${b.padStart(2,'0')}-${y.padStart(2,'0')}`;
            // Indian DD/MM/YYYY
            return `${y}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`;
        }

        // Dash-separated: DD-MM-YYYY
        const dashParts = s.split('-');
        if (dashParts.length === 3 && dashParts[0].length <= 2) {
            const [d, m, y] = dashParts;
            return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
        }

        // JS Date string / Google Sheets date serial string
        const parsed = new Date(s);
        if (!isNaN(parsed)) {
            const y = parsed.getFullYear();
            const m = String(parsed.getMonth()+1).padStart(2,'0');
            const d = String(parsed.getDate()).padStart(2,'0');
            return `${y}-${m}-${d}`;
        }

        return '';
    }

    function getActivity(d) {
        const act = (d.activity || '').toString().trim();
        return act || 'Visit';
    }

    function isDuplicate(d) {
        return (d.duplicate || '').toString().trim().toLowerCase() === 'yes';
    }

    function normalizePhoneJS(v) {
        const digits = (v || '').toString().replace(/\D/g, '');
        return digits.length >= 10 ? digits.slice(-10) : digits;
    }

    function parseDateForSort(raw) {
        const norm = normalizeDate(raw);
        return norm ? new Date(norm) : new Date(0);
    }

    // Strips any timestamp portion and returns a clean dd/mm/yyyy string,
    // regardless of whether the sheet gave us a plain date string or a
    // full JS Date/ISO string.
    function formatDateOnly(raw) {
        if (!raw) return '—';
        const s = raw.toString().trim();

        // Already dd/mm/yyyy, no time
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;

        // dd/mm/yyyy with a time portion tacked on
        const dmy = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
        if (dmy) return `${dmy[1]}/${dmy[2]}/${dmy[3]}`;

        // ISO format: YYYY-MM-DD or YYYY-MM-DDTHH:mm:ss.sssZ
        // Pulled straight out of the string — deliberately NOT routed
        // through `new Date()` + local getters, since that can shift
        // the day by one depending on the viewer's timezone.
        const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;

        // Last-resort fallback for anything else
        const d = new Date(s);
        if (!isNaN(d)) {
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        }

        return s;
    }

    function processDailyData() {
        const selectedDate = document.getElementById('targetDate').value; 
        const tbody = document.getElementById('tableBody');
        const table = document.getElementById('insightTable');
        const noDataMsg = document.getElementById('noDataMsg');
        
        tbody.innerHTML = "";

        const dailyLeads = rawData.filter(d => {
            const dateStr = d.visitdate || d.date;
            if (!dateStr) return false;
            const normalized = normalizeDate(dateStr);
            return normalized === selectedDate;
        });

        if (dailyLeads.length === 0) {
            table.style.display = 'none';
            noDataMsg.style.display = 'block';
            currentSummary = {};
            return;
        }

        table.style.display = 'table';
        noDataMsg.style.display = 'none';

        const summary = dailyLeads.reduce((acc, curr) => {
            const code = (curr.empcode || "N/A").toString().toUpperCase().trim();
            if (!acc[code]) {
                acc[code] = {
                    name: curr.execname || "Unknown",
                    branch: curr.branch || "Unknown",
                    visits: 0,
                    calls: 0,
                    duplicates: 0,
                    dupRecords: []
                };
            }
            const activity = getActivity(curr);
            if (activity === 'Call') {
                acc[code].calls++;
            } else {
                acc[code].visits++;
            }
            if (isDuplicate(curr)) {
                acc[code].duplicates++;
                acc[code].dupRecords.push(curr);
            }
            return acc;
        }, {});

        currentSummary = summary;

        Object.keys(summary).forEach(code => {
            const row = summary[code];
            const total = row.visits + row.calls;
            const safeCode = code.replace(/'/g, "\\'");
            const dupCell = row.duplicates > 0
                ? `<span class="dup-badge" onclick="showDuplicateDrilldown('${safeCode}')">⚠ ${row.duplicates}</span>`
                : `<span class="dup-none">—</span>`;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${row.branch}</strong></td>
                <td>${row.name} <span style="color:var(--text-light); font-size:12px;">(${code})</span></td>
                <td style="text-align:center;"><span class="count-badge visit">${row.visits}</span></td>
                <td style="text-align:center;"><span class="count-badge call">${row.calls}</span></td>
                <td style="text-align:center;"><span class="count-badge total">${total}</span></td>
                <td style="text-align:center;">${dupCell}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function showDuplicateDrilldown(code) {
        const row = currentSummary[code];
        if (!row || !row.dupRecords || row.dupRecords.length === 0) return;

        const modal = document.getElementById('modalOverlay');
        const title = document.getElementById('modalTitle');
        const body = document.getElementById('modalBody');

        title.innerText = `Duplicate Phone History — ${row.name} (${code})`;

        let html = '';
        row.dupRecords.forEach(record => {
            const phone = normalizePhoneJS(record.ownernumber);

            const previous = rawData.filter(d => {
                if (d === record) return false;
                return phone !== '' && normalizePhoneJS(d.ownernumber) === phone;
            }).sort((a, b) => parseDateForSort(a.date || a.visitdate) - parseDateForSort(b.date || b.visitdate));

            html += `<h4>Owner Number: ${record.ownernumber || 'N/A'}${record.ownername ? ' — ' + record.ownername : ''}</h4>`;

            if (previous.length === 0) {
                html += `<div class="no-prev">No earlier instance found in the dataset.</div>`;
            } else {
                html += `<table><tr><th>Date</th><th>Owner Name</th><th>Owner Number</th><th>Feedback</th></tr>`;
                previous.forEach(p => {
                    html += `<tr>
                        <td>${formatDateOnly(p.date || p.visitdate)}</td>
                        <td>${p.ownername || '—'}</td>
                        <td>${p.ownernumber || '—'}</td>
                        <td>${p.feedback || '—'}</td>
                    </tr>`;
                });
                html += `</table>`;
            }
        });

        body.innerHTML = html;
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }
</script>
</body>
</html>
